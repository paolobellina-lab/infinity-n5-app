<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<!-- UNO SOLO, IDENTICO in app.html e calcolatore_hub.html: e` cosi` che
     Chrome vede una sola app installabile. Questa pagina e` lo start_url:
     l'app installata si apre sempre da qui. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="img/icona_infinity.png">
<link rel="apple-touch-icon" href="img/icona_infinity.png">
<title>SCELTA FAZIONE</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
    body { margin: 0; background: #000; color: #f0f0f0; font-family: sans-serif;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 22px; padding: 24px; box-sizing: border-box; }
    h1 { font-family: 'Teko', sans-serif; font-size: 44px; margin: 0; text-align: center; letter-spacing: 1px; }
    p { color: #aaa; font-size: 17px; margin: 0; text-align: center; max-width: 320px; }
    button { min-height: 92px; width: 100%; max-width: 340px; color: #fff;
             font-family: 'Teko', sans-serif; font-size: 36px; letter-spacing: 1px; cursor: pointer; }
    .nomadi { background: #1a0000; border: 3px solid #cc0000; }
    .pano   { background: #001a33; border: 3px solid #00ccff; }
    .hub    { background: #1a1a00; border: 3px solid #ffaa00; }
</style>
</head>
<body>

<h1>QUALE FAZIONE?</h1>
<p>Questo dispositivo fa una cosa sola alla volta: scegli quale.</p>

<button class="nomadi" onclick="scegli('nomadi')">NOMADS</button>
<button class="pano" onclick="scegli('panoceania')">PANOCEANIA</button>
<button class="hub" onclick="apriHub()">HUB — REGISTA</button>

<script>
// Questa pagina NON carica nessun modulo del progetto, ed e` il motivo per
// cui esiste. Dieci file stabiliscono la fazione leggendo la stringa
// "NOMADS" nel titolo, e quel contratto non prevede un "non lo so":
// qualunque titolo diverso vale PANOCEANIA, in silenzio. Finche` la fazione
// non e` scelta, quindi, non deve girare niente che la legga.
function scegli(nome) {
    try { localStorage.setItem('fazione_app', nome); } catch (e) {}
    location.replace('app.html?fazione=' + nome);
}

// L'Hub NON ha fazione: non si tocca fazione_app, altrimenti il prossimo
// avvio dell'app giocatore erediterebbe una scelta che nessuno ha fatto.
function apriHub() {
    location.replace('calcolatore_hub.html');
}
</script>

</body>
</html>
