<!doctype html>
<html lang="it">
<head>

<title>Radar — scelta gruppo</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&amp;family=Barlow+Condensed:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0a0604}
a{color:#ff8a3d}a:hover{color:#ffb27a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a0604; color: #f2e9e2; font-family: 'Barlow Condensed', sans-serif; display: flex; flex-direction: column;">

  <div style="height: 8px; background: {{accent}}; flex-shrink: 0;"></div>

  <div style="padding: 14px 18px 10px 18px; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #2a1b13;">
    <div style="font-family: 'Teko', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 1px; color: {{accent}};">NOMADS</div>
    <div style="font-size: 15px; color: #a08f84; letter-spacing: 1px;">TURNO 2 · TUO</div>
  </div>

  <div style="padding: 18px 18px 8px 18px;">
    <div style="font-family: 'Teko', sans-serif; font-size: 26px; line-height: 1; color: #f2e9e2; letter-spacing: 1px;">SCEGLI IL GRUPPO DI COMBATTIMENTO</div>
    <div style="font-size: 15px; color: #a08f84; margin-top: 4px;">Nessun ordine in corso.</div>
  </div>

  <div style="padding: 10px 18px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">

    <button style="min-height: 96px; background: #170d08; border: 2px solid {{accent}}; color: #f2e9e2; text-align: left; padding: 14px 16px; font-family: 'Barlow Condensed', sans-serif; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 4px;">
      <span style="font-family: 'Teko', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 1px;">GRUPPO 1</span>
      <span style="font-size: 16px; color: #c9b8ad;">8 operative · 2 fuori uso</span>
      <span style="font-size: 16px; color: {{accent}};">10 ordini disponibili</span>
    </button>

    <button style="min-height: 96px; background: #170d08; border: 2px solid #4a3327; color: #f2e9e2; text-align: left; padding: 14px 16px; font-family: 'Barlow Condensed', sans-serif; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 4px;">
      <span style="font-family: 'Teko', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 1px;">GRUPPO 2</span>
      <span style="font-size: 16px; color: #c9b8ad;">4 operative · 0 fuori uso</span>
      <span style="font-size: 16px; color: {{accent}};">4 ordini disponibili</span>
    </button>

    <button style="min-height: 72px; background: #0f0906; border: 2px dashed #4a3327; color: #a08f84; text-align: left; padding: 14px 16px; font-family: 'Barlow Condensed', sans-serif; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 2px;">
      <span style="font-family: 'Teko', sans-serif; font-size: 28px; line-height: 1; letter-spacing: 1px;">RISERVA E SCHIERAMENTO AEREO</span>
      <span style="font-size: 16px;">2 truppe fuori dal tavolo</span>
    </button>

  </div>

  <div style="padding: 0 18px 18px 18px; display: flex; flex-direction: column; gap: 10px;">
    <div style="border-top: 1px solid #2a1b13; padding-top: 12px; display: flex; gap: 10px;">
      <a href="Stati.dc.html" style="flex-grow: 1; min-height: 52px; background: #140e0a; border: 2px solid #4a3327; color: #f2e9e2; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 19px; letter-spacing: 1px;">STATI TRUPPE</a>
      <a href="Attesa.dc.html" style="flex-grow: 1; min-height: 52px; background: #140e0a; border: 2px solid #4a3327; color: #f2e9e2; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 19px; letter-spacing: 1px;">SCHIERAMENTO</a>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff8a3d","options":["#ff8a3d","#e03c31","#2f9bd6","#c9a227"]},"$preview":{"width":390,"height":844}}'>

    return { accent: this.props.accent ?? '#ff8a3d' };
  }
}
